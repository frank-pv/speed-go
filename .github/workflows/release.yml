name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 安装 upx, 用于压缩产物 (对应本地 ./build.sh --upx)
      - name: Install upx
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      # 直接复用 build.sh, 与本地编译产物保持一致
      # (linux/amd64 + linux/arm64-mt7981, CGO_ENABLED=0 静态编译)
      - name: Build (未压缩)
        env:
          GOSPEED_VERSION: ${{ github.ref_name }}
          GOSPEED_OUTDIR: dist/plain
        run: ./build.sh

      - name: Build (upx 压缩)
        env:
          GOSPEED_VERSION: ${{ github.ref_name }}
          GOSPEED_OUTDIR: dist/upx
        run: ./build.sh --upx

      # upx 产物重命名加 -upx 后缀, 与未压缩产物放在同一目录
      - name: Collect artifacts
        run: |
          mkdir -p dist/release
          cp dist/plain/gospeed-* dist/release/
          for f in dist/upx/gospeed-*; do
            cp "${f}" "dist/release/$(basename "${f}")-upx"
          done

      - name: Generate checksums
        run: |
          cd dist/release
          for f in gospeed-*; do
            sha256sum "${f}" > "${f}.sha256"
          done
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/release/*
